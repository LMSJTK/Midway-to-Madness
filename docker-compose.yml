version: '3.8'

services:
  # The Vite React Frontend
  frontend:
    build: .
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules # Prevents host OS node_modules from overwriting container's
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DISABLE_HMR=false
      - API_URL=http://backend:3001
    depends_on:
      - backend

  # The Express Asset Engine Backend
  backend:
    build: .
    command: npm run editor:server
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REMBG_URL=http://rembg:5000
    depends_on:
      rembg:
        condition: service_healthy

  # Background removal service — wraps rembg in a Flask HTTP server
  rembg:
    build: ./rembg
    ports:
      - "5000:5000"
    volumes:
      # Model weights are downloaded on first boot; keep them out of the
      # container layer so a rebuild doesn't re-fetch them.
      - rembg-models:/models
    # A ceiling so a runaway inference kills this container instead of the host.
    # `restart` (not deploy.restart_policy, which only applies under swarm) then
    # brings it back, bounded so a genuine failure doesn't loop forever.
    mem_limit: 2g
    memswap_limit: 2g
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      # The model download happens before the server binds, so a first boot on a
      # cold volume needs more slack than a warm one.
      start_period: 120s

volumes:
  rembg-models:
